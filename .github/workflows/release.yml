name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older Ubuntu = older glibc, so the binary runs on more distros.
          - os: ubuntu-22.04
            platform: linux/amd64
            asset: cover-downloader-${{ github.ref_name }}-linux-amd64.tar.gz
          - os: windows-latest
            platform: windows/amd64
            asset: cover-downloader-${{ github.ref_name }}-windows-amd64.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: wails build -clean -platform ${{ matrix.platform }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar czf "${{ matrix.asset }}" -C build/bin cover-downloader

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/cover-downloader.exe -DestinationPath "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
